name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run build

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp main.js manifest.json release-assets/
          [ -f styles.css ] && cp styles.css release-assets/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release-assets/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets=(release-assets/main.js release-assets/manifest.json)
          [ -f release-assets/styles.css ] && assets+=(release-assets/styles.css)
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --generate-notes
